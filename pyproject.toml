[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe-eval"
version = "0.1.0"
description = "Educational evaluation harness for AI agent runs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pymongo>=4.8,<5.0",
  "qdrant-client>=1.11,<2.0",
  "openai>=1.50,<3.0",
  "anthropic>=0.34,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[project.scripts]
agentprobe = "agentprobe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
